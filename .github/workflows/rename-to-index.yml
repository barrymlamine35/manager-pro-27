name: Restore and rename build file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename uploaded build to index.html
        run: |
          set -e
          git config user.name "barrymlamine35"
          git config user.email "barrymlamine35@users.noreply.github.com"
          ls -l
          git rm -q index.html
          git mv football-manager-mode-carri-re-version-locale.html index.html
          git status --short
          git commit -m "Fiche joueur 3D"
          git push
