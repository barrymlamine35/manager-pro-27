name: Rename to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          mv football-manager-mode-*.html index.html
          ls -l index.html
      - name: Commit and push
        run: |
          git config user.name "barrymlamine35"
          git config user.email "barrymlamine35@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Rename uploaded file to index.html"
          git push
